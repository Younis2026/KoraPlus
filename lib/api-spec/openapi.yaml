openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sports Match Prediction API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: home
  - name: matches
  - name: predictions
  - name: leaderboard
  - name: news
  - name: profile
  - name: leagues
  - name: admin
  - name: auth
    description: Browser and mobile authentication endpoints.
  - name: social
    description: Friends, groups and social features.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /home/summary:
    get:
      operationId: getHomeSummary
      tags: [home]
      summary: Get home page aggregated summary
      responses:
        "200":
          description: Home summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"

  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List matches with filters
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [today, live, tomorrow, past, by_league]
        - name: leagueId
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get detailed match info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "404":
          description: Not found

  /matches/{id}/poll:
    get:
      operationId: getMatchPoll
      tags: [matches]
      summary: Get fan prediction poll for a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fan poll results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPoll"

  /leagues:
    get:
      operationId: listLeagues
      tags: [leagues]
      summary: List all available leagues/tournaments
      responses:
        "200":
          description: List of leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"

  /predictions/available:
    get:
      operationId: listAvailablePredictions
      tags: [predictions]
      summary: List matches available for prediction
      responses:
        "200":
          description: Matches available to predict
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PredictionMatch"

  /predictions:
    get:
      operationId: listMyPredictions
      tags: [predictions]
      summary: Get my predictions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, won, lost, all]
            default: all
      responses:
        "200":
          description: My predictions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prediction"
    post:
      operationId: createPrediction
      tags: [predictions]
      summary: Submit a new prediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionInput"
      responses:
        "201":
          description: Prediction submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "400":
          description: Invalid input

  /predictions/{id}:
    patch:
      operationId: updatePrediction
      tags: [predictions]
      summary: Edit a prediction (only before deadline)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionUpdate"
      responses:
        "200":
          description: Prediction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "400":
          description: Deadline passed or invalid input
        "404":
          description: Not found
    delete:
      operationId: deletePrediction
      tags: [predictions]
      summary: Delete a prediction (only before deadline)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Deadline passed
        "404":
          description: Not found

  /predictions/history:
    get:
      operationId: getPredictionHistory
      tags: [predictions]
      summary: Get prediction results and history
      responses:
        "200":
          description: Prediction history with results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionHistory"

  /predictions/points-calculator:
    get:
      operationId: calculatePotentialPoints
      tags: [predictions]
      summary: Calculate potential points for a prediction
      parameters:
        - name: matchId
          in: query
          required: true
          schema:
            type: string
        - name: predictionType
          in: query
          required: true
          schema:
            type: string
            enum: [score, first_goalscorer, man_of_match, total_goals]
      responses:
        "200":
          description: Potential points breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointsCalculation"

  /rewards:
    get:
      operationId: listRewards
      tags: [predictions]
      summary: Get weekly and monthly rewards showcase
      responses:
        "200":
          description: Available rewards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reward"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get global leaderboard
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [global, weekly, monthly]
            default: global
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardPage"

  /leaderboard/top:
    get:
      operationId: getTopLeaderboard
      tags: [leaderboard]
      summary: Get top 3 leaderboard of the week
      responses:
        "200":
          description: Top 3 users this week
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List news articles
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [breaking, transfers, injuries, press_conference, analysis, video_highlights, all]
            default: all
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: teamId
          in: query
          schema:
            type: ["string", "null"]
        - name: leagueId
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: News articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsArticle"

  /news/{id}:
    get:
      operationId: getNewsArticle
      tags: [news]
      summary: Get full news article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticleDetail"
        "404":
          description: Not found

  /news/{id}/bookmark:
    post:
      operationId: bookmarkArticle
      tags: [news]
      summary: Bookmark a news article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bookmark toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkResult"
        "401":
          description: Not authenticated
    delete:
      operationId: unbookmarkArticle
      tags: [news]
      summary: Remove bookmark from a news article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bookmark removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkResult"
        "401":
          description: Not authenticated

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /profile/setup:
    patch:
      operationId: setupProfile
      tags: [profile]
      summary: Complete profile setup (set display name after first login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSetupInput"
      responses:
        "200":
          description: Profile setup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated

  /profile/achievements:
    get:
      operationId: getAchievements
      tags: [profile]
      summary: Get user badges and achievements
      responses:
        "200":
          description: Achievements list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"

  /profile/favorites:
    get:
      operationId: getFavorites
      tags: [profile]
      summary: Get user's favorite teams and leagues
      responses:
        "200":
          description: User favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserFavorites"
    patch:
      operationId: updateFavorites
      tags: [profile]
      summary: Update user's favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoritesUpdate"
      responses:
        "200":
          description: Updated favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserFavorites"

  /profile/stats:
    get:
      operationId: getProfileStats
      tags: [profile]
      summary: Get user prediction stats summary
      responses:
        "200":
          description: Profile stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileStats"

  # ─── Admin endpoints ─────────────────────────────────────────────────────────

  /admin/matches:
    get:
      operationId: listAdminMatches
      tags: [admin]
      summary: List all matches for admin management
      responses:
        "200":
          description: All matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMatch"
    post:
      operationId: createAdminMatch
      tags: [admin]
      summary: Create a new match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMatchInput"
      responses:
        "201":
          description: Match created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMatch"
        "400":
          description: Invalid input

  /admin/matches/{id}:
    patch:
      operationId: updateAdminMatch
      tags: [admin]
      summary: Update match score, status, or minute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMatchUpdate"
      responses:
        "200":
          description: Match updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMatch"
        "404":
          description: Not found

  /admin/matches/{id}/events:
    post:
      operationId: addMatchEvent
      tags: [admin]
      summary: Add a live match event (goal, card, substitution)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEventInput"
      responses:
        "201":
          description: Event added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMatchEvent"
        "404":
          description: Not found

  /admin/matches/{id}/events/{eventId}:
    delete:
      operationId: deleteMatchEvent
      tags: [admin]
      summary: Remove a match event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /admin/matches/{id}/settle:
    post:
      operationId: settleMatchPredictions
      tags: [admin]
      summary: Settle all predictions for a finished match and award points
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Predictions settled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettleResult"
        "404":
          description: Not found

  /admin/articles:
    get:
      operationId: listAdminArticles
      tags: [admin]
      summary: List all news articles for admin management
      responses:
        "200":
          description: All articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminArticle"
    post:
      operationId: createAdminArticle
      tags: [admin]
      summary: Publish a new news article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminArticleInput"
      responses:
        "201":
          description: Article published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminArticle"
        "400":
          description: Invalid input

  /admin/articles/{id}:
    patch:
      operationId: updateAdminArticle
      tags: [admin]
      summary: Update a news article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminArticleUpdate"
      responses:
        "200":
          description: Article updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminArticle"
        "404":
          description: Not found
    delete:
      operationId: deleteAdminArticle
      tags: [admin]
      summary: Delete a news article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /admin/predictions/configs:
    get:
      operationId: listPredictionConfigs
      tags: [admin]
      summary: List prediction settings for all matches
      responses:
        "200":
          description: Prediction configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPredictionConfig"

  /admin/predictions/configs/{matchId}:
    patch:
      operationId: updatePredictionConfig
      tags: [admin]
      summary: Update prediction settings for a match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPredictionConfigUpdate"
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPredictionConfig"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users for admin management
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/points:
    patch:
      operationId: adjustUserPoints
      tags: [admin]
      summary: Manually adjust a user's points
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPointAdjustmentInput"
      responses:
        "200":
          description: Points adjusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: Not found

  /admin/leaderboard/reset:
    post:
      operationId: resetLeaderboard
      tags: [admin]
      summary: Reset weekly or monthly leaderboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLeaderboardResetInput"
      responses:
        "200":
          description: Leaderboard reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLeaderboardResetResult"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard overview stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  # ─── Auth endpoints ───────────────────────────────────────────────────────────

  /auth/user:
    get:
      tags: [auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.

  /logout:
    get:
      tags: [auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  # ─── Social endpoints ─────────────────────────────────────────────────────────

  /leaderboard/friends:
    get:
      tags: [social]
      operationId: getFriendsLeaderboard
      summary: Get leaderboard for users you follow
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Friends leaderboard entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardPage'
        '401':
          description: Not authenticated.

  /social/search:
    get:
      tags: [social]
      operationId: searchUsers
      summary: Search users by name or username
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Matching users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSearchEntry'

  /social/friends/{userId}:
    post:
      tags: [social]
      operationId: followUser
      summary: Follow a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Now following.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowResult'
        '401':
          description: Not authenticated.
    delete:
      tags: [social]
      operationId: unfollowUser
      summary: Unfollow a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Unfollowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowResult'
        '401':
          description: Not authenticated.

  /social/groups:
    get:
      tags: [social]
      operationId: listMyGroups
      summary: List group leagues the current user belongs to
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: My group leagues.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupLeague'
        '401':
          description: Not authenticated.
    post:
      tags: [social]
      operationId: createGroup
      summary: Create a new private group league
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupLeagueInput'
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupLeague'
        '401':
          description: Not authenticated.

  /social/groups/join:
    post:
      tags: [social]
      operationId: joinGroup
      summary: Join a group league using an invite code
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinGroupInput'
      responses:
        '200':
          description: Joined group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupLeague'
        '400':
          description: Invalid invite code.
        '401':
          description: Not authenticated.

  /social/groups/{id}:
    get:
      tags: [social]
      operationId: getGroupLeaderboard
      summary: Get group details and leaderboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Group leaderboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupLeagueDetail'
        '401':
          description: Not authenticated.
        '404':
          description: Group not found.

