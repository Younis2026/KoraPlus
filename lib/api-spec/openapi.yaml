    UserSearchEntry:
      type: object
      required: [id, name, username, avatar, totalPoints, globalRank, isFollowing]
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        avatar:
          type: string
        totalPoints:
          type: integer
        globalRank:
          type: integer
        isFollowing:
          type: boolean

    FollowResult:
      type: object
      required: [following, userId]
      properties:
        following:
          type: boolean
        userId:
          type: string

    GroupLeague:
      type: object
      required: [id, name, inviteCode, memberCount, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        inviteCode:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    GroupLeagueInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60

    JoinGroupInput:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:
          type: string
          minLength: 1

    GroupLeagueDetail:
      type: object
      required: [id, name, inviteCode, memberCount, createdAt, entries]
      properties:
        id:
          type: string
        name:
          type: string
        inviteCode:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
